<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rock paper scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="game-zone">
        <div class="match-banner" id="round-info"></div>
        <canvas id="canvas1"></canvas>
      </div>

      <aside class="info-panel">
        <section class="scoreboard">
          <h2>Ranking</h2>
          <div id="score-list"></div>
        </section>

        <div class="credits-bar">
          <span class="credits-label">Créditos</span>
          <strong class="credits-value" id="credits">0</strong>
          <span class="credits-emoji">💰</span>
        </div>

        <section class="shop">
          <h2>Entrenamiento</h2>
          <div class="shop-list" id="shop-list"></div>
        </section>
      </aside>
    </div>

    <div class="menu-overlay" id="menu-overlay" hidden>
      <div class="menu-modal">
        <h2 id="menu-title">Pausa</h2>
        <div id="menu-body"></div>
        <div id="menu-actions" class="menu-actions"></div>
      </div>
    </div>

    <script type="module" src="src/index.js"></script>
  </body>
</html>
